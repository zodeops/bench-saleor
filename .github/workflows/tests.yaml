name: Tests

# Task 41 proof: the unit test suite sharded across forks of this job's
# machine by zode-ci (one step, no matrix). shards=1 is the one-machine
# baseline; plant=true adds a failing test.
on:
  workflow_dispatch:
    inputs:
      runner:
        description: runs-on label for every job
        default: zode-4x8
      shards:
        description: zode-ci --shards (1, a number or auto)
        default: "1"
      plant:
        description: add a failing test
        default: "false"

env:
  CACHE_URL: "redis://cache:6379/0"
  DATABASE_URL: "postgres://saleor:saleor@postgres:5432/saleor"
  SECRET_KEY: ci-test

permissions: {}

jobs:
  unit_tests:
    runs-on: ${{ inputs.runner }}
    container:
      image: python:3.12
      volumes:
        - /usr/local/bin/zode-ci:/usr/local/bin/zode-ci
        - /var/lib/zode-ci:/var/lib/zode-ci
    name: Run unit tests
    permissions:
      contents: read
    services:
      postgres:
        image: library/postgres:15-alpine
        env:
          POSTGRES_PASSWORD: saleor
          POSTGRES_USER: saleor
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      cache:
        image: valkey/valkey:8.1-alpine
        options: >-
          --health-cmd "valkey-cli ping | grep PONG"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install system dependencies
        run: |
          apt-get update
          apt-get install -y libpq-dev postgresql-common
          /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          apt-get install -y postgresql-client-15
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: false
      - name: Install dependencies
        run: uv sync --locked
      - name: Create the test databases
        run: |
          # one per xdist worker, as upstream's cached-DB path does
          uv run pytest --reuse-db -m "not e2e" -n logical -q -p no:randomly saleor/core/tests/test_utils.py || true
          psql "$DATABASE_URL" -Atc "select datname from pg_database where datname like 'test_%'"
      - name: Plant a failing test
        if: inputs.plant == 'true'
        run: printf 'def test_zode_planted_failure():\n    assert 1 == 2, "planted by the task 41 proof"\n' > saleor/core/tests/test_zode_planted.py
      - name: Run unit tests
        run: |
          zode-ci test --shards "${{ inputs.shards }}" -- uv run pytest --reuse-db -m "not e2e" -n logical
