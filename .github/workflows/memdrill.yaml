name: Memory fork drill

# Task 41.5: shards on forks with memory. The Postgres service keeps running
# in each worker; the job's canary secret must be nowhere in a worker's RAM.
on:
  workflow_dispatch:
    inputs:
      runner:
        default: zode-2x4
      fork:
        default: memory
      hold:
        description: seconds each test waits (memory scan window)
        default: "150"

permissions: {}

jobs:
  drill:
    runs-on: ${{ inputs.runner }}
    services:
      postgres:
        image: library/postgres:15-alpine
        env:
          POSTGRES_PASSWORD: drill
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - name: Use the canary secret (a job secret no worker may hold)
        env:
          ZODE_CANARY: ${{ secrets.ZODE_CANARY }}
        run: test -n "$ZODE_CANARY" && echo "canary is set (${#ZODE_CANARY} chars)"
      - name: A small Go suite
        run: |
          mkdir -p drill && cd drill
          printf 'module drill\n\ngo 1.21\n' > go.mod
          for p in a b c; do
            mkdir -p $p
            printf 'package %s\n\nimport (\n\t"net"\n\t"os"\n\t"testing"\n\t"time"\n)\n\nfunc TestService(t *testing.T) {\n\tc, err := net.DialTimeout("tcp", "127.0.0.1:5432", 5*time.Second)\n\tif err != nil {\n\t\tt.Fatalf("postgres is not running here: %%v", err)\n\t}\n\tc.Close()\n\tt.Logf("shard %%s: postgres answers", os.Getenv("ZODE_CI_SHARD"))\n\ttime.Sleep(${{ inputs.hold }} * time.Second)\n}\n' $p > $p/${p}_test.go
          done
      - name: Sharded tests
        working-directory: drill
        run: zode-ci test --shards 3 --fork "${{ inputs.fork }}" -- go test -v ./...
